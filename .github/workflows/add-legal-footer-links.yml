name: Add legal footer links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-footers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Terms and Privacy links to every HTML footer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in Path('.').glob('*.html'):
              if path.name in {'terms-and-conditions.html', 'privacy-policy.html'}:
                  continue
              text = path.read_text(encoding='utf-8')
              if 'terms-and-conditions.html' in text or 'privacy-policy.html' in text:
                  continue
              footer = re.search(r'(<footer[\s\S]*?</footer>)', text, re.I)
              if not footer:
                  continue
              block = footer.group(1)
              links = '<a href="terms-and-conditions.html">Terms &amp; Conditions</a><a href="privacy-policy.html">Privacy Policy</a>'
              nav = re.search(r'(<nav[^>]*aria-label=["\']Footer navigation["\'][^>]*>)([\s\S]*?)(</nav>)', block, re.I)
              if nav:
                  replacement = nav.group(1) + nav.group(2) + links + nav.group(3)
                  block = block[:nav.start()] + replacement + block[nav.end():]
              else:
                  block = block.replace('</footer>', '<nav aria-label="Legal"><a href="terms-and-conditions.html">Terms &amp; Conditions</a><a href="privacy-policy.html">Privacy Policy</a></nav></footer>')
              text = text[:footer.start()] + block + text[footer.end():]
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' .github/workflows/add-legal-footer-links.yml
          git rm -f .github/workflows/add-legal-footer-links.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Terms and Privacy links to site footers"
          git push
