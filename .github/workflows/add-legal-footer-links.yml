name: Add legal footer links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-footers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Terms and Privacy links to every HTML footer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in Path('.').glob('*.html'):
              if path.name in {'terms-and-conditions.html', 'privacy-policy.html'}:
                  continue
              text = path.read_text(encoding='utf-8')
              if 'terms-and-conditions.html' in text or 'privacy-policy.html' in text:
                  continue
              footer = re.search(r'(<footer[\\s\\S]*?</footer>)', text, re.I)
              if not footer:
                  continue
              block = footer.group(1)
              links = '<a href="terms-and-conditions.html">Terms &amp; Conditions</a><a href="privacy-policy.html">Privacy Policy</a>'
              if 'Quick Links' in block:
                  block = block.replace('</nav>', links + '</nav>', 1)
              else:
                  block = block.replace('</footer>', '<nav aria-label="Legal"><a href="terms-and-conditions.html">Terms &amp; Conditions</a><a href="privacy-policy.html">Privacy Policy</a></nav></footer>')
              text = text[:footer.start()] + block + text[footer.end():]
              path.write_text(text, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          if sitemap.exists():
              text = sitemap.read_text(encoding='utf-8')
              additions = []
              if '/terms-and-conditions.html' not in text:
                  additions.append('  <url><loc>https://hyperroof.com/terms-and-conditions.html</loc><lastmod>2026-10-12</lastmod></url>')
              if '/privacy-policy.html' not in text:
                  additions.append('  <url><loc>https://hyperroof.com/privacy-policy.html</loc><lastmod>2026-10-12</lastmod></url>')
              if additions:
                  text = text.replace('</urlset>', '\n'.join(additions) + '\n</urlset>')
                  sitemap.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' sitemap.xml .github/workflows/add-legal-footer-links.yml
          git rm -f .github/workflows/add-legal-footer-links.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Terms and Privacy links to site footers"
          git push
