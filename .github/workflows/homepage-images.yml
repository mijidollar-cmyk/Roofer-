name: Improve homepage images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/homepage-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace generic homepage images with Miami-focused imagery
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          old_hero = 'https://images.unsplash.com/photo-1773432114061-2ae201208630'
          old_about = 'https://images.unsplash.com/photo-1763665814605-a6489a3bf2a0'
          old_project_2 = 'https://images.unsplash.com/photo-1763665814965-b5c4b3547908'

          miami_home = 'https://images.unsplash.com/photo-1578439297699-eb414262c2de'
          miami_tile = 'https://images.unsplash.com/photo-1611601147344-66391134330f'
          roof_workers = 'https://images.unsplash.com/photo-1681049400158-0ff6249ac315'

          s = s.replace(old_hero, miami_home)
          s = s.replace(old_about, miami_tile)
          s = s.replace(old_project_2, roof_workers)

          s = re.sub(r'(&q=)(?:28|30)(?=[&\" ])', r'\g<1>55', s)

          s = s.replace('Roofing crew installing new roof tiles on a residential building', 'Miami residential roof and tropical waterfront home')
          s = s.replace('Roofing workers installing new roof panels on a house', 'Florida-style tile roof on a Miami-area home')
          s = s.replace('Crew installing roof tiles on a residential project', 'Miami-area residential roof project with tile roofing')
          s = s.replace('Roofers fitting dark roof tiles during construction', 'Roofing workers installing tile roofing')

          # Remove placeholder contact details until a real business phone is supplied.
          s = s.replace('href="contact.html" aria-label="Request a free roofing estimate from Hyper Roof"', 'href="#contact" aria-label="Request a free roofing estimate from Hyper Roof"')
          s = s.replace('Get a Free Estimate <span aria-hidden="true">→</span>', 'Request a Free Estimate <span aria-hidden="true">→</span>')

          # Keep homepage claims consistent with an independent information/referral service.
          replacements = {
            'Licensed &amp; Insured</strong><small>Your Safety Our Priority': 'Independent Roofing Referral Service</strong><small>Local Miami contractor options',
            'Licensed &amp; Insured</strong><span>Professional protection and peace of mind.': 'Independent Roofing Guidance</strong><span>Clear information and contractor referral options.',
            '<strong>15+</strong><span>Years<br>of Experience</span>': '<strong>Miami</strong><span>Local Roofing<br>Focus</span>',
            'Hyper Roof helps Miami property owners protect what matters with dependable roofing services, quality materials, and professional workmanship. Whether you need a small roof repair, a complete roof replacement, or a new commercial roof, our team focuses on durable results and clear communication.': 'Hyper Roof helps Miami property owners understand roofing needs and connect with participating roofing contractors. Whether you need a roof repair, replacement, storm-damage help, or commercial roofing, we make it easier to compare your options and request an estimate.',
            '<li>Experienced &amp; Certified Team</li>': '<li>Participating Roofing Professionals</li>',
            '<li>High-Quality Roofing Materials</li>': '<li>Miami-Specific Roofing Guidance</li>',
            '<li>Clear, Competitive Pricing</li>': '<li>Clear Estimate Requests</li>',
            '<li>Customer-Focused Service</li>': '<li>Independent Referral Support</li>',
            'Talk to Our Roofing Team <span aria-hidden="true">→</span>': 'Request Roofing Help <span aria-hidden="true">→</span>',
            'Reliable Roofing Services in Miami, FL': 'Independent Roofing Help in Miami, FL',
            '<strong>Quality Workmanship</strong><span>Roofing built for dependable long-term performance.</span>': '<strong>Quality-Focused Options</strong><span>Explore roofing professionals for your property needs.</span>',
            '<strong>Responsive Service</strong><span>We respect your schedule and communicate clearly.</span>': '<strong>Local Referral Support</strong><span>Start with clear information about your roofing needs.</span>',
            '<strong>Fair Pricing</strong><span>Transparent recommendations without unnecessary work.</span>': '<strong>Clear Recommendations</strong><span>Compare repair, replacement and other roofing options.</span>'
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          s = s.replace('Get dependable roof repair, roof replacement, new roof installation, emergency roofing, and commercial roofing for Miami homes and businesses. Start with a clear recommendation and a free estimate.', 'Explore roof repair, roof replacement, new roof installation, emergency roofing, and commercial roofing options for Miami homes and businesses. Start with local guidance and request a free estimate from a participating contractor.')
          s = s.replace('Professional new roof installation with careful workmanship from preparation through final inspection.', 'Explore new roof installation options and connect with a participating roofing contractor for project guidance.')
          s = s.replace('Reliable roofing solutions for offices, retail properties, and other commercial buildings in Miami.', 'Compare commercial roofing options for offices, retail properties, and other commercial buildings in Miami.')
          s = s.replace('Repair leaks, missing shingles, storm damage, and other roofing problems before they become costly.', 'Learn about leaks, missing shingles, storm damage, and other roofing problems before they become more costly.')
          s = s.replace('Replace aging or damaged roofs with durable materials selected for your property and budget.', 'Learn when an aging or damaged roof may need replacement and what options may fit your property and budget.')

          p.write_text(s)
          PY

      - name: Improve image sizing and visual polish
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('css/style.css')
          s = p.read_text()
          additions = '''\n.hero-image{image-rendering:auto}.about-section .image-card img{aspect-ratio:3/2;object-fit:cover}.projects-mini .project-row{grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch}.projects-mini .project-row img{width:100%;aspect-ratio:3/2;height:auto;object-fit:cover;border-radius:4px;box-shadow:0 3px 12px #06244018}@media(max-width:760px){.projects-mini .project-row{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.projects-mini .project-row{grid-template-columns:1fr}}\n'''
          if '.projects-mini .project-row img{' not in s:
              s += additions
          p.write_text(s)
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html css/style.css
          if git diff --cached --quiet; then
            echo 'No homepage image or copy changes needed.'
          else
            git commit -m 'Align homepage trust claims with referral model'
            git push
          fi
