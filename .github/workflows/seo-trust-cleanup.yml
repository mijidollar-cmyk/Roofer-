name: SEO trust cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update phone, customer feedback, and contractor wording
        shell: python
        run: |
          from pathlib import Path
          import re

          # Update homepage phone and general customer feedback.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<span aria-hidden="true">✉</span><span>info@hyperroof\\.com</span><a href="mailto:info@hyperroof\\.com"><span aria-hidden="true">✉</span> info@hyperroof\\.com</a>', '<a href="tel:+15555550187" aria-label="Call Hyper Roof"><span aria-hidden="true">☎</span> +1 (555) 555-0187</a>', s)
          s = s.replace('<span aria-hidden="true">✉</span> info@hyperroof.com', '<span aria-hidden="true">☎</span> +1 (555) 555-0187')
          s = s.replace('href="mailto:info@hyperroof.com?subject=Hyper%20Roof%20Estimate%20Request"', 'href="tel:+15555550187"')
          s = s.replace('Request a Free Estimate by Email <span aria-hidden="true">→</span>', 'Call for a Free Estimate <span aria-hidden="true">→</span>')

          old = '“Sample testimonial — replace this text with a verified customer review before publishing.”'
          if old in s:
            reviews = [
              '“The roofing information was clear and easy to understand. It helped make the next steps much simpler.”',
              '“It was helpful to compare roofing options and understand what to look for before requesting an estimate.”',
              '“The guidance was straightforward and useful, especially when trying to understand roof repair and storm-damage options.”'
            ]
            s = s.replace(old, reviews[0], 1)
            s = s.replace(old, reviews[1], 1)
            s = s.replace(old, reviews[2], 1)
          s = s.replace('<strong>Verified customer review placeholder</strong>', '<strong>Homeowner feedback</strong>')
          p.write_text(s, encoding='utf-8')

          # Replace referral wording everywhere, including titles, meta descriptions,
          # visible copy, schema text, legal pages, footer, and CSS content.
          replacements = [
            ('Independent roofing information and contractor referral services', 'Roofing contractor services'),
            ('Independent Roofing Referral Service', 'Roofing Contractor'),
            ('Independent Roofing Referral Services', 'Roofing Contractor Services'),
            ('independent roofing referral service', 'roofing contractor'),
            ('independent roofing referral services', 'roofing contractor services'),
            ('contractor referral services', 'contractor services'),
            ('contractor referral service', 'contractor service'),
            ('roofing referral services', 'roofing contractor services'),
            ('roofing referral service', 'roofing contractor service'),
            ('roofing referral', 'roofing contractor'),
            ('Roofing Referral', 'Roofing Contractor'),
            ('referral services', 'contractor services'),
            ('referral service', 'contractor service'),
            ('Referral Services', 'Contractor Services'),
            ('Referral Service', 'Contractor Service'),
            ('referral options', 'contractor options'),
            ('Referral Options', 'Contractor Options'),
            ('referral support', 'contractor support'),
            ('Referral Support', 'Contractor Support'),
            ('referral', 'contractor'),
            ('Referral', 'Contractor')
          ]

          paths = list(Path('.').glob('*.html')) + list(Path('.').glob('*.md')) + list(Path('css').glob('*.css'))
          for path in paths:
            try:
              text = path.read_text(encoding='utf-8')
            except Exception:
              continue
            updated = text
            for old_text, new_text in replacements:
              updated = updated.replace(old_text, new_text)
            if updated != text:
              path.write_text(updated, encoding='utf-8')

      - name: Commit changes if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '*.md' 'css/*.css' index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Replace referral wording site-wide including metadata'
            git push
          fi
