name: SEO trust cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unsupported homepage claims
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('href="#testimonials">Testimonials</a>', 'href="#faq">FAQ</a>')
          s = s.replace('<a href="#faq">FAQ</a><a href="#faq">FAQ</a>', '<a href="#faq">FAQ</a>')
          s = re.sub(r'<section class="section testimonials" id="testimonials".*?</section>\n', '', s, flags=re.S)
          s = s.replace('OUR PROJECTS', 'ROOFING EXAMPLES')
          s = s.replace('Recent Roofing Projects in Miami', 'Miami Roofing Examples')
          s = s.replace('Miami-area residential roof project with tile roofing', 'Miami-area roofing example')
          s = s.replace('Roofing workers installing tile roofing', 'Roofing installation example')
          s = s.replace('Roofing crew working on a steep residential roof', 'Residential roofing example')
          s = s.replace('href="tel:+15555550187"', 'href="mailto:info@hyperroof.com?subject=Hyper%20Roof%20Estimate%20Request"')
          s = s.replace('Call for a Free Estimate <span aria-hidden="true">→</span>', 'Request a Free Estimate by Email <span aria-hidden="true">→</span>')
          s = s.replace('Talk to our Miami roofing team about repairs, replacement, new installation, or commercial roofing.', 'Request roofing information or contractor referral help for repairs, replacement, new installation, or commercial roofing.')
          s = s.replace('Yes. Hyper Roof provides urgent response for active leaks and storm-related roof damage so you can protect your property and plan the next repair.', 'Hyper Roof provides information and contractor referral options for active leaks and storm-related roof damage. Physical emergency work is performed by participating contractors.')
          p.write_text(s, encoding='utf-8')
      - name: Commit cleanup if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No homepage cleanup changes needed.'
          else
            git commit -m 'Fix homepage trust and conversion claims'
            git push
          fi
