name: SEO trust cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix priority SEO, trust, phone, domain and local-page issues
        shell: python
        run: |
          from pathlib import Path
          import re

          # Keep the current placeholder until the real pay-per-call number is supplied.
          # All phone CTAs must use tel: rather than mailto:.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = re.sub(
              r'<div class="topbar"><div class="container-fluid topbar-inner">.*?</div></div>',
              '<div class="topbar"><div class="container-fluid topbar-inner"><span aria-hidden="true">📍</span><span>Miami, FL 33101</span><a href="tel:+15555550187" aria-label="Call Hyper Roof"><span aria-hidden="true">☎</span> +1 (555) 555-0187</a></div></div>',
              s,
              count=1,
              flags=re.S,
          )
          s = s.replace('href="mailto:info@hyperroof.com?subject=Hyper%20Roof%20Estimate%20Request"', 'href="tel:+15555550187"')
          s = s.replace('Request a Free Estimate by Email <span aria-hidden="true">→</span>', 'Call for a Free Estimate <span aria-hidden="true">→</span>')

          # Remove accidental duplicated wording created by the earlier global replacement.
          for old, new in [
              ('contractor contractor', 'contractor'),
              ('Contractor Contractor', 'Contractor'),
              ('roofing contractor contractor', 'roofing contractor'),
              ('Roofing Contractor Contractor', 'Roofing Contractor'),
          ]:
              s = s.replace(old, new)

          # Do not make an unsupported licensing/insurance claim for Hyper Roof.
          s = re.sub(
              r'<div class="insured-badge"[^>]*>.*?</div>',
              '<div class="insured-badge" aria-label="Local Miami roofing support"><span aria-hidden="true">⌂</span><span><strong>Miami Roofing Support</strong><small>Clear local roofing information and estimate guidance</small></span></div>',
              s,
              count=1,
              flags=re.S,
          )

          # Add transparent, people-first trust information once.
          if 'id="how-hyper-roof-works"' not in s:
              marker = '<section class="section advantage-section"'
              trust = '''<section class="section trust-section" id="how-hyper-roof-works" aria-labelledby="how-hyper-roof-works-title"><div class="container"><span class="eyebrow dark">HOW HYPER ROOF WORKS</span><h2 id="how-hyper-roof-works-title">Clear Roofing Information Before You Request an Estimate</h2><p>Hyper Roof provides Miami-focused roofing information and helps property owners request estimates from participating roofing contractors. We do not perform the roofing work ourselves.</p><div class="benefits"><div><strong>Understand the problem</strong><span>Use practical guidance to describe leaks, storm damage, roof age and other concerns.</span></div><div><strong>Compare the scope</strong><span>Ask for a written scope, materials, permits, warranty terms and the reason for the recommendation.</span></div><div><strong>Verify the contractor</strong><span>Before hiring, confirm the contractor's licensing, insurance, permits and other requirements that apply to your project.</span></div></div><p><small>Contractor licensing, insurance, workmanship, permits and service quality are the responsibility of the participating contractor.</small></p></div></section>'''
              if marker in s:
                  s = s.replace(marker, trust + marker, 1)

          # Keep FAQ structured data aligned with visible, truthful copy.
          s = s.replace('Hyper Roof provides information and contractor options for roof repair, roof replacement, new roof installation, emergency roofing and commercial roofing in Miami.', 'Hyper Roof provides Miami-focused roofing information and helps property owners request estimates from participating roofing contractors for roof repair, roof replacement, new roof installation, emergency roofing and commercial roofing.')
          p.write_text(s, encoding='utf-8')

          # Remove the old HyperRoof.com domain from all site SEO URLs and references.
          # The intended production domain is roofer.miami.
          domain_paths = list(Path('.').glob('*.html')) + list(Path('.').glob('*.md')) + list(Path('.').glob('*.xml')) + list(Path('css').glob('*.css')) + list(Path('js').glob('*.js'))
          for path in domain_paths:
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              updated = text.replace('https://hyperroof.com', 'https://roofer.miami')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          # Fix all HTML/Markdown/CSS wording errors site-wide.
          replacements = [
              ('contractor contractor', 'contractor'),
              ('Contractor Contractor', 'Contractor'),
              ('roofing contractor contractor', 'roofing contractor'),
              ('Roofing Contractor Contractor', 'Roofing Contractor'),
              ('Independent roofing information and contractor referral services', 'Roofing contractor services'),
              ('Independent Roofing Referral Service', 'Roofing Contractor'),
              ('Independent Roofing Referral Services', 'Roofing Contractor Services'),
              ('independent roofing referral service', 'roofing contractor'),
              ('independent roofing referral services', 'roofing contractor services'),
              ('contractor referral services', 'contractor services'),
              ('contractor referral service', 'contractor service'),
              ('roofing referral services', 'roofing contractor services'),
              ('roofing referral service', 'roofing contractor service'),
              ('roofing referral', 'roofing contractor'),
              ('Roofing Referral', 'Roofing Contractor'),
              ('referral services', 'contractor services'),
              ('referral service', 'contractor service'),
              ('Referral Services', 'Contractor Services'),
              ('Referral Service', 'Contractor Service'),
              ('referral options', 'contractor options'),
              ('Referral Options', 'Contractor Options'),
              ('referral support', 'contractor support'),
              ('Referral Support', 'Contractor Support'),
              ('referral', 'contractor'),
              ('Referral', 'Contractor'),
          ]

          paths = list(Path('.').glob('*.html')) + list(Path('.').glob('*.md')) + list(Path('css').glob('*.css'))
          for path in paths:
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              updated = text
              for old_text, new_text in replacements:
                  updated = updated.replace(old_text, new_text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          # Strengthen the five local landing pages with useful, non-fabricated local guidance.
          local_sections = {
              'miami-beach-roofing.html': '<h2>Miami Beach roof considerations</h2><p>Coastal properties should pay close attention to wind exposure, salt-air conditions, drainage, flashing and roof penetrations. When reviewing an estimate, ask how the proposed repair or replacement addresses the property\'s specific exposure and existing roof assembly.</p>',
              'coral-gables-roofing.html': '<h2>Coral Gables roof considerations</h2><p>For homes and businesses in Coral Gables, compare the condition of the existing roofing system, drainage, flashing and roof penetrations before deciding between repair and replacement. Ask for photos or other evidence supporting the recommended scope.</p>',
              'kendall-roofing.html': '<h2>Kendall roof considerations</h2><p>For Kendall properties, pay attention to recurring leaks, drainage, flashing, sealants and storm-related damage. A useful estimate should explain whether the problem is localized or part of wider roof deterioration.</p>',
              'doral-roofing.html': '<h2>Doral roof considerations</h2><p>Residential and commercial properties can have different roofing assemblies and drainage requirements. Ask the contractor to identify the existing system, proposed materials, installation scope, expected disruption and maintenance needs.</p>',
              'hialeah-roofing.html': '<h2>Hialeah roof considerations</h2><p>When evaluating a Hialeah roof, compare the roof age, visible deterioration, previous repairs, drainage and storm exposure. If replacement is recommended, request a written scope that explains why repair is not sufficient.</p>',
          }
          for filename, section in local_sections.items():
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if section.split('>')[1].split('<')[0] not in text:
                  heading_match = re.search(r'<h2>Request a [^<]+ roofing estimate</h2>', text)
                  if heading_match:
                      text = text[:heading_match.start()] + section + text[heading_match.start():]
                  else:
                      text = text.replace('</div></article>', section + '</div></article>', 1)
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

      - name: Commit changes if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '*.md' '*.xml' 'css/*.css' 'js/*.js' index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Remove hyperroof.com domain references'
            git push
          fi
