name: Sync shared footer and header

on:
  push:
    branches: [main]
    paths:
      - 'footer.html'
      - 'css/header-stable.css'
      - '.github/workflows/sync-footer.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync shared footer and stable header into HTML pages
        shell: python
        run: |
          from pathlib import Path
          import re

          footer = Path('footer.html').read_text(encoding='utf-8').strip()
          header_link = '<link rel="stylesheet" href="css/header-stable.css?v=20261012-1">'

          for path in Path('.').glob('*.html'):
              if path.name == 'footer.html':
                  continue

              text = path.read_text(encoding='utf-8')

              # Replace every existing footer with the shared footer.
              text = re.sub(r'<footer\b[^>]*>.*?</footer>', footer, text, flags=re.I | re.S)

              # Ensure every page gets the stable header CSS. Remove older duplicate
              # header-stable links first so the page has one authoritative version.
              text = re.sub(r'\s*<link\s+rel=["\']stylesheet["\']\s+href=["\']css/header-stable\.css[^>]*>', '', text, flags=re.I)
              if re.search(r'</head>', text, flags=re.I):
                  text = re.sub(r'</head>', f'  {header_link}\n</head>', text, count=1, flags=re.I)

              path.write_text(text, encoding='utf-8')

      - name: Commit synchronized layout fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git diff --cached --quiet && exit 0
          git commit -m "Fix header overlap across blog pages"
          git push
